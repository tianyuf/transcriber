[project]
name = "archivist-transcribe"
version = "0.1.0"
description = "Transcribe scanned archival documents (PDFs or photos, any language) page by page with vision models on OpenRouter, then check the result with a second model and proofread it against the scans."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24,<2",  # 2.x adds onnxruntime and a layout model we do not need
    "httpx>=0.27",
    "rich>=13.7",
    "keyring>=25",
]

[project.scripts]
archivist = "archivist_transcribe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archivist_transcribe"]
