[project]
name = "transcriber"
version = "0.1.0"
description = "Transcribe scanned archival documents (PDFs or photos, any language) with vision models through OpenRouter or native provider APIs, then validate and proofread them against the scans."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24,<2",  # 2.x adds onnxruntime and a layout model we do not need
    "httpx>=0.27",
    "rich>=13.7",
    "keyring>=25",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]
